# systemd-sysusers(8): the account that owns the export store and runs the transfer service (and the vLLM container,
# when its image runs as a non-root uid). A uid below UID_MIN (1000) is a system account: systemd-logind RemoveIPC never
# deletes its files, and it has no login sessions to end. The number must be free as both uid and gid, and identical,
# on every host, because containers are started with --user <uid>:<gid>. 980 is an example: check it with
# `getent passwd 980; getent group 980` on each host first. Install this on the bridge host too: the bridge's user joins
# group kvhandoff to read the token.
g kvhandoff 980
u kvhandoff 980:980 "kvhandoff export store" - -
